version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: broiler_postgres
    restart: always
    environment:
      POSTGRES_DB: broiler_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: broiler_api
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@postgres:5432/broiler_erp
      SECRET_KEY: SUPER_SECRET_KEY_BROILER_ERP_2026_PRODUCTION_READY
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: broiler_web
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
